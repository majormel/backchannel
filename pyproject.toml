[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backchannel"
version = "0.1.0"
description = "Capture, search, and replay the HTTP(S) traffic behind any app - a mitmproxy-based dashboard, JSON API, and MCP tools for chatting with your traffic"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Melkon" }]
keywords = ["mitmproxy", "mcp", "proxy", "traffic-analysis", "http", "https", "security-research"]
requires-python = ">=3.13"
dependencies = ["mcp[cli]>=2,<3", "mitmproxy>=12.2.3,<13", "protobuf>=4.0", "qrcode[pil]>=7.4", "websockets>=11,<14"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/majormel/backchannel"
Repository = "https://github.com/majormel/backchannel"
Issues = "https://github.com/majormel/backchannel/issues"
Documentation = "https://github.com/majormel/backchannel#readme"

[project.optional-dependencies]
crypto = ["cryptography>=41.0"]
frida = ["frida>=16.0", "frida-tools>=12.0"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
backchannel = "backchannel.server:main"

[tool.setuptools]
packages = ["backchannel", "backchannel.dashboard_dist", "backchannel.dashboard_dist.assets", "backchannel.dashboard_dist.brand", "backchannel.frida_scripts", "decoder", "cli"]

[tool.setuptools.package-data]
backchannel = ["dashboard_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.uv]
override-dependencies = [
    "cryptography==50.0.0",
    "h2==4.4.1",
    "msgpack==1.2.1",
    "tornado==6.5.9",
]
