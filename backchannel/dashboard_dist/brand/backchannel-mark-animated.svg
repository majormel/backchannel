<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Backchannel" class="brand-mark" fill="none"><style>.brand-mark {
  isolation: isolate;
  animation: brand-arrive 450ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* One request/response exchange per cycle; decorative, not capture status. */
.brand-lane { animation: brand-draw 900ms cubic-bezier(.22, 1, .36, 1) both; }
.brand-lane-return { animation-delay: 160ms; }
.brand-packet { animation: brand-transmit 6s ease-in-out infinite; }
.brand-tip { animation: brand-receive 6s ease-in-out infinite; }
.brand-packet-return, .brand-tip-return { animation-delay: 1.65s; }
.brand-sheen { animation: brand-reflect 6s ease-in-out infinite; }
.brand-edge-trace { animation: brand-trace 6s linear infinite; }

.brand-emblem {
  border-radius: 14px;
  transition: transform 220ms ease, filter 220ms ease;
}

@media (hover: hover) and (pointer: fine) {
  .brand-lockup:hover .brand-emblem { transform: translateY(-1px); filter: brightness(1.12) drop-shadow(0 3px 7px #6ce8b01c); }
  .brand-lockup:hover .brand-wordmark-dot { text-shadow: 0 0 8px hsl(153 90% 70% / 0.4); }
}

@keyframes brand-arrive {
  from { opacity: 0; transform: translateY(3px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes brand-transmit {
  0%, 10% { stroke-dashoffset: 25; opacity: 0; }
  16% { opacity: 1; }
  30% { stroke-dashoffset: -90; opacity: 1; }
  36%, 100% { stroke-dashoffset: -115; opacity: 0; }
}

@keyframes brand-draw {
  from { stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; }
  to { stroke-dasharray: 100; stroke-dashoffset: 0; opacity: 1; }
}

@keyframes brand-receive {
  0%, 26%, 43%, 100% { opacity: 0; }
  32% { opacity: .9; }
}

@keyframes brand-reflect {
  0%, 48% { transform: translateX(0); opacity: 0; }
  54% { opacity: .7; }
  80%, 100% { transform: translateX(145px); opacity: 0; }
}

@keyframes brand-trace {
  0%, 48% { stroke-dashoffset: 20; opacity: 0; }
  56% { opacity: .55; }
  85%, 100% { stroke-dashoffset: -100; opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .brand-mark, .brand-mark * { animation: none !important; }
  .brand-packet, .brand-tip, .brand-sheen, .brand-edge-trace { display: none; }
  .brand-emblem { transition: none; transform: none !important; }
}
</style><defs><linearGradient id="brand-glass-R0" x1="16" y1="12" x2="80" y2="90" gradientUnits="userSpaceOnUse"><stop stop-color="#2d5946"></stop><stop offset=".52" stop-color="#142e23"></stop><stop offset="1" stop-color="#0a1711"></stop></linearGradient><linearGradient id="brand-edge-R0" x1="12" y1="10" x2="80" y2="92" gradientUnits="userSpaceOnUse"><stop stop-color="#b5ffdc" stop-opacity=".48"></stop><stop offset=".48" stop-color="#80e4b6" stop-opacity=".1"></stop><stop offset="1" stop-color="#85e6ca" stop-opacity=".28"></stop></linearGradient><linearGradient id="brand-sheen-R0"><stop stop-color="#d9ffeb" stop-opacity="0"></stop><stop offset=".5" stop-color="#d9ffeb" stop-opacity=".22"></stop><stop offset="1" stop-color="#d9ffeb" stop-opacity="0"></stop></linearGradient><clipPath id="brand-clip-R0"><rect x="10" y="10" width="76" height="76" rx="24"></rect></clipPath></defs><rect x="10" y="10" width="76" height="76" rx="24" fill="url(#brand-glass-R0)" stroke="url(#brand-edge-R0)" stroke-width="1.5"></rect><rect x="13" y="13" width="70" height="70" rx="21" stroke="#d9ffeb" stroke-opacity=".045"></rect><path d="M34 14h28a20 20 0 0 1 14 5" stroke="#daffec" stroke-opacity=".12" stroke-width="1.5" stroke-linecap="round"></path><g clip-path="url(#brand-clip-R0)"><g class="brand-sheen" opacity="0"><path d="m-52-10 35-12L35 106 0 118Z" fill="url(#brand-sheen-R0)"></path></g></g><rect class="brand-edge-trace" x="10" y="10" width="76" height="76" rx="24" pathLength="100" stroke="#baffdc" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="18 82" opacity="0"></rect><g stroke-linecap="round" stroke-linejoin="round"><path class="brand-lane" pathLength="100" d="M28 37h38m-9-9 9 9-9 9" stroke="#c9ffe4" stroke-width="4.2"></path><path class="brand-lane brand-lane-return" pathLength="100" d="M68 59H30m9-9-9 9 9 9" stroke="#6ce8b0" stroke-width="4.2"></path><path class="brand-packet" d="M28 37h38" pathLength="100" stroke="#f1fff7" stroke-width="4.2" stroke-dasharray="22 120" stroke-dashoffset="25" opacity="0"></path><path class="brand-packet brand-packet-return" d="M68 59H30" pathLength="100" stroke="#d1ffeb" stroke-width="4.2" stroke-dasharray="22 120" stroke-dashoffset="25" opacity="0"></path><path class="brand-tip" d="m57 28 9 9-9 9" stroke="#f1fff7" stroke-width="4.2" opacity="0"></path><path class="brand-tip brand-tip-return" d="m39 50-9 9 9 9" stroke="#d1ffeb" stroke-width="4.2" opacity="0"></path></g></svg>
